name: Build

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name=SistemaGestionPersonal --add-data="src;src" src/main.py
    
    - name: Create package
      run: Compress-Archive -Path dist\SistemaGestionPersonal.exe -DestinationPath SistemaGestionPersonal-Windows.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: SistemaGestionPersonal-Windows.zip
        retention-days: 30
