name: Compilar e Instalar (Windows + Linux)

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar pruebas
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-pytest
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  build-linux:
    name: "Compilar ejecutable (Linux: Debian 11 / Ubuntu 19)"
    needs: tests
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar uv
        # Las releases de setup-uv son inmutables desde v8: usar la versión
        # completa (v10.0.1), no la etiqueta major "v10" (no existe).
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Instalar Python 3.11 portable (glibc 2.17)
        run: |
          # uv instala python-build-standalone, compilado contra glibc 2.17.
          # Al empaquetar con ese intérprete, el ejecutable funciona en
          # distribuciones antiguas: Debian 11 (glibc 2.31), Ubuntu 19
          # (2.29/2.30), Ubuntu 18.04 (2.27), etc.
          uv python install 3.11

      - name: Crear entorno virtual e instalar dependencias
        run: |
          # uv prohíbe instalar paquetes en su Python gestionado
          # (externally managed); se crea un venv con ese intérprete para
          # conservar la compatibilidad glibc 2.17.
          uv venv --python "$(uv python find 3.11)" --no-project .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$PWD/.venv/bin/python" -r requirements.txt pyinstaller
          .venv/bin/python --version

      - name: Instalar xvfb (pantalla virtual para el selftest GUI)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Leer versión
        run: |
          ver=$(cat VERSION)
          echo "APP_VERSION=$ver" >> $GITHUB_ENV
          echo "Versión detectada: $ver"

      - name: Verificar importación de módulos (incluye tkinter)
        run: python -c "import sys; sys.path.insert(0, '.'); import tkinter; import src.main; print('imports OK (tkinter + app)')"

      - name: Compilar ejecutable (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean spec/app.spec

      - name: Verificar ejecutable
        run: |
          binario="dist/SistemaGestionPersonal/SistemaGestionPersonal"
          if [ ! -f "$binario" ]; then
            echo "ERROR: El ejecutable no fue generado: $binario"
            exit 1
          fi
          ls -lh "$binario"

      - name: Autoverificar ejecutable (selftest)
        run: |
          SGP_BASE_DIR=/tmp/sgp_selftest xvfb-run -a ./dist/SistemaGestionPersonal/SistemaGestionPersonal --selftest

      - name: Verificar compatibilidad glibc (Debian 11 y Ubuntu 19)
        run: |
          set -e
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq binutils
          fi
          MAX_GLIBC=""
          for f in $(find dist/SistemaGestionPersonal -type f \( -name 'SistemaGestionPersonal' -o -name '*.so*' \)); do
            v=$(objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
            if [ -n "$v" ]; then
              echo "  $f -> glibc $v"
              if [ -z "$MAX_GLIBC" ]; then MAX_GLIBC="$v"; else MAX_GLIBC=$(printf '%s\n%s\n' "$MAX_GLIBC" "$v" | sort -V | tail -1); fi
            fi
          done
          echo "Versión máxima de glibc requerida: ${MAX_GLIBC:-ninguna}"
          if [ -n "$MAX_GLIBC" ] && [ "$(printf '%s\n2.28\n' "$MAX_GLIBC" | sort -V | tail -1)" = "2.28" ]; then
            echo "OK: máximo glibc $MAX_GLIBC (Debian 11 usa 2.31, Ubuntu 19 usa 2.29/2.30)"
          else
            echo "ERROR: el paquete requiere glibc ${MAX_GLIBC:-desconocida}; no funcionará en Debian 11 / Ubuntu 19"
            exit 1
          fi

      - name: Probar ejecutable en Debian 11 real (contenedor glibc 2.31)
        run: |
          docker run --rm \
            -v "$PWD/dist:/app" \
            debian:11-slim bash -c "
              set -e
              # bullseye está EOL: apt debe usar archive.debian.org
              sed -i 's|deb.debian.org|archive.debian.org|g' /etc/apt/sources.list 2>/dev/null || true
              apt-get update -qq || true
              apt-get install -y -qq xvfb xauth fonts-dejavu-core >/dev/null 2>&1
              SGP_BASE_DIR=/tmp/sgp_selftest xvfb-run -a /app/SistemaGestionPersonal/SistemaGestionPersonal --selftest
              echo 'OK: el ejecutable funciona en Debian 11'
            "

      - name: Crear paquete portable (tar.gz)
        run: |
          tar -czf "SistemaGestionPersonal-Linux-$APP_VERSION.tar.gz" -C dist SistemaGestionPersonal
          ls -lh "SistemaGestionPersonal-Linux-$APP_VERSION.tar.gz"

      - name: Subir versión portable Linux (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ejecutable-portable-linux
          path: SistemaGestionPersonal-Linux-${{ env.APP_VERSION }}.tar.gz
          retention-days: 30

  build:
    name: Compilar e instalar (Windows)
    needs: [tests, build-linux]
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python (Windows)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Leer versión
        shell: pwsh
        run: |
          $ver = (Get-Content -Path VERSION).Trim()
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Versión detectada: $ver"

      - name: Verificar importación de módulos
        run: python -c "import sys; sys.path.insert(0, '.'); import src.main; print('imports OK')"

      - name: Compilar ejecutable (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean spec/app.spec

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "dist\SistemaGestionPersonal\SistemaGestionPersonal.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "El ejecutable no fue generado: $exe"
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK ejecutable: $size MB"

      - name: Autoverificar ejecutable (selftest)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\SistemaGestionPersonal\SistemaGestionPersonal.exe" `
            -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Código de salida del selftest: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe (Inno Setup 6) no encontrado"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar instalador
        shell: pwsh
        run: |
          $setup = "dist_installer\SistemaGestionPersonal-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "El instalador no fue generado: $setup"
            exit 1
          }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "OK instalador: $size MB"

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SistemaGestionPersonal" `
            -DestinationPath "SistemaGestionPersonal-Windows-$env:APP_VERSION.zip" -Force
          Write-Host "OK zip portable"

      - name: Descargar versión Linux (para el release)
        uses: actions/download-artifact@v4
        with:
          name: ejecutable-portable-linux
          path: linux-artifact

      - name: Definir etiqueta y nombre del release
        shell: pwsh
        run: |
          $isTag = $env:GITHUB_REF_TYPE -eq "tag"
          if ($isTag) {
            # Push de etiqueta v*: el release usa la etiqueta versionada
            $tag = $env:GITHUB_REF_NAME
            $nombre = "Sistema de Gestión de Personal $env:APP_VERSION"
          } else {
            # Push normal (main): release continua sin etiqueta manual.
            # El nombre no empieza con "v" para no re-disparar el workflow
            # (el trigger de etiquetas solo escucha "v*").
            $tag = "continuous-v$env:APP_VERSION.$env:GITHUB_RUN_NUMBER"
            $nombre = "Release continua v$env:APP_VERSION (#$env:GITHUB_RUN_NUMBER)"
          }
          Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "RELEASE_NAME=$nombre" >> $env:GITHUB_ENV
          Write-Host "Release: $nombre (etiqueta $tag)"

      - name: Subir instalador (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist_installer/SistemaGestionPersonal-Setup-${{ env.APP_VERSION }}.exe
          retention-days: 30

      - name: Subir versión portable (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ejecutable-portable-windows
          path: SistemaGestionPersonal-Windows-${{ env.APP_VERSION }}.zip
          retention-days: 30

      - name: Publicar release (cada push a main o etiqueta v*)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            Compilación automática del commit `${{ github.sha }}` en `${{ github.ref_name }}`.
            Descarga el instalador (**Setup.exe**), la versión portable de Windows (ZIP)
            o la versión portable de Linux (tar.gz).
          files: |
            dist_installer/SistemaGestionPersonal-Setup-${{ env.APP_VERSION }}.exe
            SistemaGestionPersonal-Windows-${{ env.APP_VERSION }}.zip
            linux-artifact/SistemaGestionPersonal-Linux-${{ env.APP_VERSION }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
