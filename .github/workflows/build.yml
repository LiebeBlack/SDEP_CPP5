name: Compilar e Instalar (Windows + Linux)

on:
  push:
    branches: [main, develop]
    # SIN etiquetas v*: esas las procesa release.yml, que es el ÚNICO workflow
    # que firma. Si build.yml también corrriera en tags, publicaría una release
    # SIN FIRMAR (sus pasos no firman nada) que competiría con la firmada.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          # 3.15 es pre-release hasta 2026-10-01: allow-prereleases permite
          # que setup-python resuelva la rc más reciente. Retirar la opción
          # cuando se publique la versión final.
          python-version: "3.15"
          allow-prereleases: true
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar pruebas
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-pytest
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  build-linux:
    name: "Compilar ejecutable (Linux: Debian 13 / Ubuntu 25.04+)"
    needs: tests
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Leer versión
        run: |
          ver=$(cat VERSION)
          echo "APP_VERSION=$ver" >> $GITHUB_ENV
          echo "Versión detectada: $ver"

      - name: Compilar dentro de Debian 13 (glibc 2.41)
        run: |
          # Se compila en Debian 13 (glibc 2.41), el sistema más antiguo que
          # se quiere soportar tras la migración a Python 3.15. Debian 13 trae
          # Python 3.13, así que 3.15 se instala con uv (builds independientes
          # con Tcl/Tk incluidos); las librerías que PyInstaller empaqueta
          # exigen como máximo la glibc del contenedor.
          docker run --rm \
            -v "$PWD:/work" -w /work \
            debian:13 bash -c "
              set -e
              # Sin esto, apt-get se cuelga en el prompt interactivo de tzdata
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              # binutils provee objdump, requerido por PyInstaller en Linux
              apt-get install -y -qq ca-certificates curl binutils
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH=\"/root/.local/bin:$PATH\"
              uv python install 3.15
              uv venv --python 3.15 /opt/venv
              . /opt/venv/bin/activate
              uv pip install -r requirements.txt pyinstaller
              python -c 'import sys; sys.path.insert(0, \".\"); import tkinter; import src.main; print(\"imports OK (tkinter + app, \" + sys.version.split()[0] + \")\")'
              python -m PyInstaller --noconfirm --clean spec/app.spec
            "

      - name: Verificar ejecutable
        run: |
          binario="dist/SistemaGestionPersonal/SistemaGestionPersonal"
          if [ ! -f "$binario" ]; then
            echo "ERROR: El ejecutable no fue generado: $binario"
            exit 1
          fi
          ls -lh "$binario"

      - name: Autoverificar en Debian 13 (glibc 2.41)
        run: |
          docker run --rm \
            -v "$PWD/dist:/app" \
            debian:13-slim bash -c "
              set -e
              # Sin esto, apt-get se cuelga en el prompt interactivo de tzdata
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq xvfb xauth fonts-dejavu-core >/dev/null 2>&1
              SGP_BASE_DIR=/tmp/sgp_selftest xvfb-run -a /app/SistemaGestionPersonal/SistemaGestionPersonal --selftest
              echo 'OK: el ejecutable funciona en Debian 13'
            "

      - name: Verificar compatibilidad glibc (Debian 13)
        run: |
          set -e
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq binutils
          fi
          MAX_GLIBC=""
          for f in $(find dist/SistemaGestionPersonal -type f \( -name 'SistemaGestionPersonal' -o -name '*.so*' \)); do
            v=$(objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
            if [ -n "$v" ]; then
              echo "  $f -> glibc $v"
              if [ -z "$MAX_GLIBC" ]; then MAX_GLIBC="$v"; else MAX_GLIBC=$(printf '%s\n%s\n' "$MAX_GLIBC" "$v" | sort -V | tail -1); fi
            fi
          done
          echo "Versión máxima de glibc requerida: ${MAX_GLIBC:-ninguna}"
          if [ -n "$MAX_GLIBC" ] && [ "$(printf '%s\n2.41\n' "$MAX_GLIBC" | sort -V | tail -1)" = "2.41" ]; then
            echo "OK: máximo glibc $MAX_GLIBC <= 2.41 (Debian 13 usa 2.41, Ubuntu 24.04 LTS usa 2.39)"
          else
            echo "ERROR: el paquete requiere glibc ${MAX_GLIBC:-desconocida}; no funcionará en Debian 13 / Ubuntu 24.04+"
            exit 1
          fi

      - name: Probar ejecutable en Debian 13 real (contenedor glibc 2.41)
        run: |
          docker run --rm \
            -v "$PWD/dist:/app" \
            debian:13-slim bash -c "
              set -e
              # Sin esto, apt-get se cuelga en el prompt interactivo de tzdata
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq xvfb xauth fonts-dejavu-core >/dev/null 2>&1
              SGP_BASE_DIR=/tmp/sgp_selftest xvfb-run -a /app/SistemaGestionPersonal/SistemaGestionPersonal --selftest
              echo 'OK: el ejecutable funciona en Debian 13'
            "

      - name: Crear paquete portable (tar.gz)
        run: |
          tar -czf "SistemaGestionPersonal-Linux-$APP_VERSION.tar.gz" -C dist SistemaGestionPersonal
          ls -lh "SistemaGestionPersonal-Linux-$APP_VERSION.tar.gz"

      - name: Subir versión portable Linux (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ejecutable-portable-linux
          path: SistemaGestionPersonal-Linux-${{ env.APP_VERSION }}.tar.gz
          retention-days: 30

  build:
    name: Compilar e instalar (Windows)
    needs: [tests, build-linux]
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python (Windows)
        uses: actions/setup-python@v6
        with:
          # 3.15 pre-release (ver comentario del job de pruebas).
          python-version: "3.15"
          allow-prereleases: true

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Leer versión y generar información de build
        shell: pwsh
        run: |
          $ver = (Get-Content -Path VERSION).Trim()
          # Releases continuas: la versión visible incluye el número de build
          # (2.79.55). En etiquetas v* se usa solo la versión del VERSION.
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $buildVersion = $ver
          } else {
            $buildVersion = "$ver.$env:GITHUB_RUN_NUMBER"
          }
          $commit = $env:GITHUB_SHA.Substring(0, [Math]::Min(7, $env:GITHUB_SHA.Length))
          $contenido = @"
          """Generado automaticamente por CI. No editar."""
          BUILD_VERSION = "$buildVersion"
          BUILD_COMMIT = "$commit"
          BUILD_DATE = "$(Get-Date -Format o)"
          "@
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) "src\config\build_info.py"),
            $contenido,
            [Text.UTF8Encoding]::new($false)
          )
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "BUILD_VERSION=$buildVersion" >> $env:GITHUB_ENV
          Write-Host "Versión: $ver | Build: $buildVersion | Commit: $commit"

      - name: Verificar importación de módulos
        run: python -c "import sys; sys.path.insert(0, '.'); import src.main; print('imports OK')"

      - name: Compilar ejecutable (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean spec/app.spec

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "dist\SistemaGestionPersonal\SistemaGestionPersonal.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "El ejecutable no fue generado: $exe"
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK ejecutable: $size MB"

      - name: Autoverificar ejecutable (selftest)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\SistemaGestionPersonal\SistemaGestionPersonal.exe" `
            -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Código de salida del selftest: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }

      - name: Compilar actualizador automático (SDEP_CPP5_AutoUpdater.exe)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean updater/updater.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\SDEP_CPP5_AutoUpdater.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "El actualizador no fue generado: $exe"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist_updater" | Out-Null
          Move-Item -Force $exe "dist_updater\SDEP_CPP5_AutoUpdater.exe"
          $size = [math]::Round((Get-Item "dist_updater\SDEP_CPP5_AutoUpdater.exe").Length / 1MB, 1)
          Write-Host "OK actualizador: $size MB"

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe (Inno Setup 6) no encontrado"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar instalador
        shell: pwsh
        run: |
          $setup = "dist_installer\SistemaGestionPersonal-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "El instalador no fue generado: $setup"
            exit 1
          }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "OK instalador: $size MB"

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SistemaGestionPersonal" `
            -DestinationPath "SistemaGestionPersonal-Windows-$env:APP_VERSION.zip" -Force
          Write-Host "OK zip portable"

      # NOTA: este workflow NO publica releases. Solo compila y verifica.
      # TODAS las releases (con firma digital) las publica exclusivamente
      # .github/workflows/release.yml, que firma cada archivo antes de
      # empaquetar y verifica al final.

      - name: Subir instalador (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist_installer/SistemaGestionPersonal-Setup-${{ env.APP_VERSION }}.exe
          retention-days: 30

      - name: Subir versión portable (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ejecutable-portable-windows
          path: SistemaGestionPersonal-Windows-${{ env.APP_VERSION }}.zip
          retention-days: 30

      # Publicación de releases: EXCLUSIVAMENTE en release.yml (firma masiva
      # profunda + auditoría final). Aquí solo quedan los artefactos del
      # workflow descargables desde la pestaña Actions.
