name: Build

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name=SistemaGestionPersonal --add-data="src;src" src/main.py
    
    - name: Create package
      run: Compress-Archive -Path dist\SistemaGestionPersonal.exe -DestinationPath SistemaGestionPersonal-Windows.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: SistemaGestionPersonal-Windows.zip
        retention-days: 30
    
    - name: Create pre-release (develop only)
      if: github.ref == 'refs/heads/develop'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: dev-${{ github.run_number }}
        name: Dev Build ${{ github.run_number }}
        files: SistemaGestionPersonal-Windows.zip
        draft: false
        prerelease: true
        body: |
          Development build ${{ github.run_number }}
          
          Este es un release automático generado por cada push a develop.
          
          ## 📦 Installation
          Download the Windows executable from the assets below.
          
          ## 🔧 System Requirements
          - Windows 10/11
          - 4GB RAM minimum
          - 500MB disk space
          
          ---
          *Auto-generated from develop branch*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
