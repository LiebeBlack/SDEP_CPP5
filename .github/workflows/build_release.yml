name: Android APK Firmado (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-signed:
    name: Compilar y firmar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Leer versión
        run: |
          # tr elimina el CR de las copias Windows del archivo antes de
          # publicar la variable de entorno (un CR rompe el nombre del artefacto).
          ver=$(tr -d '\r' < VERSION)
          if [ -z "$ver" ]; then
            echo "ERROR: VERSION está vacío" >&2
            exit 1
          fi
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Versión detectada: $ver"

      - name: Configurar JDK 17 y caché de Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # El almacén se restaura ANTES de compilar: signingConfigs/release solo
      # se crea si SDEP_KEYSTORE apunta a un archivo existente. Si se
      # decodificara después, Gradle generaría app-release-unsigned.apk y no
      # habría APK firmado que verificar.
      - name: Restaurar almacén de firmas (release.keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltan=0
          for secreto in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secreto}" ]; then
              echo "ERROR: falta el secreto $secreto" >&2
              faltan=1
            fi
          done
          if [ "$faltan" -ne 0 ]; then
            echo "ERROR: la firma de release necesita los cuatro secretos" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > release.keystore
          if [ ! -s release.keystore ]; then
            echo "ERROR: release.keystore no se generó correctamente" >&2
            exit 1
          fi
          ls -lh release.keystore

      - name: Dar permisos al wrapper de Gradle
        run: chmod +x android/gradlew

      # Gradle compila y firma en el mismo paso, con signingConfigs/release.
      - name: Compilar y firmar APK de release
        env:
          SDEP_KEYSTORE: ${{ github.workspace }}/release.keystore
          SDEP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SDEP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SDEP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease \
            --no-daemon --build-cache --stacktrace

      - name: Localizar APK de release firmado
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "ERROR: no se generó el APK firmado ($apk)" >&2
            echo "Si solo existe app-release-unsigned.apk, Gradle no tomó el almacén." >&2
            ls -l android/app/build/outputs/apk/release/ 2>/dev/null || true
            exit 1
          fi
          echo "RELEASE_APK=$apk" >> "$GITHUB_ENV"
          echo "APK de release: $apk"
          ls -lh "$apk"

      # apksigner confirma que la firma quedó incrustada (v1/v2/v3/v4).
      - name: Verificar APK firmado (v1/v2/v3/v4)
        run: |
          if [ -z "${ANDROID_HOME}" ]; then
            echo "ERROR: ANDROID_HOME no está definido" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V -r | head -1)
          if [ ! -x "$apksigner" ]; then
            echo "ERROR: apksigner no encontrado" >&2
            exit 1
          fi
          echo "Verificando APK firmado con $apksigner"
          "$apksigner" verify --verbose --print-certs "$RELEASE_APK"

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.APP_VERSION }}
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 30

      # La firma v4 (.idsig) solo aparece si Gradle la genera: se publica
      # aparte para no romper la subida del APK cuando no existe.
      - name: Subir firma v4 (.idsig)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.APP_VERSION }}-idsig
          path: ${{ env.RELEASE_APK }}.idsig
          if-no-files-found: ignore
          retention-days: 30

      - name: Borrar el almacén de firmas del runner
        if: always()
        run: rm -f release.keystore
