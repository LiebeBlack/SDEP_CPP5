name: Canary Deployment

on:
  push:
    branches: [ canary ]
  workflow_dispatch:

jobs:
  canary:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build canary executable
      run: |
        pyinstaller --onefile --windowed --name=SistemaGestionPersonal-Canary --add-data="src;src" src/main.py
    
    - name: Create canary package
      run: Compress-Archive -Path dist\SistemaGestionPersonal-Canary.exe -DestinationPath SistemaGestionPersonal-Canary.zip
    
    - name: Create canary release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: canary-${{ github.run_number }}
        name: Canary Release ${{ github.run_number }}
        files: SistemaGestionPersonal-Canary.zip
        draft: false
        prerelease: true
        body: |
          Canary release for testing purposes.
          This is a pre-release version.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
