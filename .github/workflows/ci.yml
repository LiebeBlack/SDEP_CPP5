name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26.x'
    
    - name: Setup wxWidgets
      run: |
        choco install wxwidgets -y
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "$wxPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "wxWidgets found at: $wxPath"
        } else {
          echo "wxWidgets not found at expected location"
          Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "*wxWidgets*" }
        }
      shell: pwsh
    
    - name: Setup wxWidgets Environment
      run: |
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "wxWidgets_ROOT=$wxPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$wxPath" >> $env:GITHUB_ENV
        }
      shell: pwsh
    
    - name: Build
      run: |
        mkdir build
        cd build
        # Try multiple Visual Studio generators
        $generators = @("Visual Studio 17 2022", "Visual Studio 16 2019", "Visual Studio 15 2017")
        $success = $false
        
        foreach ($gen in $generators) {
          Write-Host "Trying generator: $gen"
          cmake .. -G "$gen" -A x64
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Generator $gen works!"
            $success = $true
            break
          }
        }
        
        if (-not $success) {
          Write-Host "No Visual Studio generator worked, trying default"
          cmake ..
        }
        
        cmake --build . --config Release
      shell: pwsh
      continue-on-error: true
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Windows
        path: build/Release/SDEP.exe
        retention-days: 7
        if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libsqlite3-dev
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Linux
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        brew install cmake wxwidgets sqlite3
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-macOS
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore