name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  CMAKE_VERSION: '3.30.x'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.30.x'
    
    - name: Setup wxWidgets
      run: |
        choco install wxwidgets -y
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "wxWidgets_ROOT=$wxPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$wxPath" >> $env:GITHUB_ENV
          echo "wxWidgets found at: $wxPath"
        } else {
          echo "wxWidgets not found at expected location"
          Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "*wxWidgets*" }
        }
      shell: pwsh
    
    - name: Setup wxWidgets Environment
      run: |
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "wxWidgets_DIR=$wxPath\build\msw" >> $env:GITHUB_ENV
          echo "wxWidgets_ROOT_DIR=$wxPath" >> $env:GITHUB_ENV
        }
      shell: pwsh
    
    - name: Build
      run: |
        # Create build directory
        mkdir build
        cd build

        # Configure with CMake using NMake generator (works with MSVC)
        cmake .. -G "NMake Makefiles" `
          -DwxWidgets_ROOT_DIR=C:\wxWidgets-3.3.1 `
          -DwxWidgets_DIR=C:\wxWidgets-3.3.1\build\msw `
          -DCMAKE_BUILD_TYPE=Release

        if ($LASTEXITCODE -ne 0) {
          Write-Host "CMake configuration failed"
          exit 1
        }

        # Build the project
        nmake
      shell: pwsh
    
    - name: List Build Output
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Recurse build -ErrorAction SilentlyContinue
        Write-Host "Release directory contents:"
        if (Test-Path build/Release) {
          Get-ChildItem build/Release -ErrorAction SilentlyContinue
        } else {
          Write-Host "Release directory not found"
        }
        Write-Host "Debug directory contents:"
        if (Test-Path build/Debug) {
          Get-ChildItem build/Debug -ErrorAction SilentlyContinue
        } else {
          Write-Host "Debug directory not found"
        }
      shell: pwsh
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Windows
        path: |
          build/Release/*.exe
          build/Debug/*.exe
          build/*.exe
        retention-days: 7
        if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libsqlite3-dev
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Linux
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        brew install cmake wxwidgets sqlite3
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-macOS
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore