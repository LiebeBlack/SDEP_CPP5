name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.26.x'
    
    - name: Setup wxWidgets
      run: |
        choco install wxwidgets
        echo "C:\Program Files (x86)\wxWidgets-3.0.5" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDEP-Windows
        path: build/Release/SDEP.exe
        retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.0-gtk3-dev libsqlite3-dev
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDEP-Linux
        path: build/SDEP
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        brew install cmake wxmac sqlite3
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDEP-macOS
        path: build/SDEP
        retention-days: 7