name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  CMAKE_VERSION: '3.30.x'
  VCPKG_DEFAULT_BINARY_CACHE: ''

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.30.x'
    
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
    
    - name: Build
      run: |
        # Create build directory
        mkdir build
        cd build

        # Configure with CMake using vcpkg toolchain
        cmake .. -G "Ninja" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "CMake configuration failed"
          exit 1
        }

        # Build the project
        ninja
      shell: pwsh
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Windows
        path: build/SDEP.exe
        retention-days: 7
        if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libsqlite3-dev
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make VERBOSE=1
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Linux
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        brew install cmake wxwidgets sqlite3
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-macOS
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore
