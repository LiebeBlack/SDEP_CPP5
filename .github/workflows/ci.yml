name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26.x'
    
    - name: Setup wxWidgets
      run: |
        choco install wxwidgets -y
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "wxWidgets_ROOT=$wxPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$wxPath" >> $env:GITHUB_ENV
          echo "wxWidgets found at: $wxPath"
        } else {
          echo "wxWidgets not found at expected location"
          Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "*wxWidgets*" }
        }
      shell: pwsh
    
    - name: Setup wxWidgets Environment
      run: |
        $wxPath = "C:\wxWidgets-3.3.1"
        if (Test-Path $wxPath) {
          echo "wxWidgets_DIR=$wxPath\build\msw" >> $env:GITHUB_ENV
          echo "wxWidgets_ROOT_DIR=$wxPath" >> $env:GITHUB_ENV
        }
      shell: pwsh
    
    - name: Build
      run: |
        mkdir build
        cd build
        # Configure CMake with wxWidgets - try VS 18 2025 first (newest on runner)
        cmake .. -G "Visual Studio 18 2025" -A x64 `
          -DwxWidgets_ROOT_DIR=C:\wxWidgets-3.3.1 `
          -DwxWidgets_DIR=C:\wxWidgets-3.3.1\build\msw
        
        # If VS 18 2025 fails, try VS 17 2022
        if ($LASTEXITCODE -ne 0) {
          Write-Host "VS 18 2025 failed, trying VS 17 2022"
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DwxWidgets_ROOT_DIR=C:\wxWidgets-3.3.1 `
            -DwxWidgets_DIR=C:\wxWidgets-3.3.1\build\msw
        }
        
        # If VS 17 2022 fails, try VS 16 2019
        if ($LASTEXITCODE -ne 0) {
          Write-Host "VS 17 2022 failed, trying VS 16 2019"
          cmake .. -G "Visual Studio 16 2019" -A x64 `
            -DwxWidgets_ROOT_DIR=C:\wxWidgets-3.3.1 `
            -DwxWidgets_DIR=C:\wxWidgets-3.3.1\build\msw
        }
        
        # Build the project
        cmake --build . --config Release --verbose
      shell: pwsh
    
    - name: List Build Output
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Recurse build -ErrorAction SilentlyContinue
        Write-Host "Release directory contents:"
        if (Test-Path build/Release) {
          Get-ChildItem build/Release -ErrorAction SilentlyContinue
        } else {
          Write-Host "Release directory not found"
        }
        Write-Host "Debug directory contents:"
        if (Test-Path build/Debug) {
          Get-ChildItem build/Debug -ErrorAction SilentlyContinue
        } else {
          Write-Host "Debug directory not found"
        }
      shell: pwsh
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Windows
        path: |
          build/Release/*.exe
          build/Debug/*.exe
          build/*.exe
        retention-days: 7
        if-no-files-found: error
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Windows
        path: build/Release/SDEP.exe
        retention-days: 7
        if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libsqlite3-dev
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Linux
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        brew install cmake wxwidgets sqlite3
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-macOS
        path: build/SDEP
        retention-days: 7
        if-no-files-found: ignore