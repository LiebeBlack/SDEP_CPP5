name: Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Generate Version
      id: version
      run: |
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Build Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.0-gtk3-dev libsqlite3-dev
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
        if [ -f SDEP ]; then
          tar -czf SDEP-Linux.tar.gz SDEP
          echo "Linux build successful"
        else
          echo "Linux build failed"
          exit 1
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDEP-Linux
        path: build/SDEP-Linux.tar.gz

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: SDEP v${{ steps.version.outputs.version }} (Canary)
        body: |
          ## SDEP Educational Management System - Canary Release
          
          **Version**: ${{ steps.version.outputs.version }}
          **Date**: ${{ github.event.head_commit.timestamp }}
          **Commit**: ${{ github.sha }}
          
          ### 🚀 Auto-compiled binaries
          
          This is an automatic canary release compiled from the latest main branch.
          
          ### 📦 Downloads
          
          - **Linux**: SDEP-Linux.tar.gz
          
          ### 🔐 Default Credentials
          
          - **Username**: admin
          - **Password**: Admin123!
          
          ### ⚠️ Important
          
          Change the default password immediately after first login.
          
          ---
          
          *Built with GitHub Actions*
        files: build/SDEP-Linux.tar.gz
        draft: false
        prerelease: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}