name: Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-all:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Version
      id: version
      run: |
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Get Commit Info
      id: commit
      run: |
        echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
        echo "commit_date=$(git log -1 --pretty=%ci)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

    - name: Build Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libsqlite3-dev
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
        if [ -f SDEP ]; then
          tar -czf SDEP-Linux.tar.gz SDEP
          echo "Linux build successful"
        else
          echo "Linux build failed - SDEP binary not found"
          ls -la
          exit 1
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: SDEP-Linux
        path: build/SDEP-Linux.tar.gz
        if-no-files-found: ignore

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: SDEP v${{ steps.version.outputs.version }} (Canary)
        body: |
          ## SDEP Educational Management System - Canary Release
          
          **Version**: ${{ steps.version.outputs.version }}
          **Build Date**: ${{ steps.commit.outputs.commit_date }}
          **Commit SHA**: ${{ steps.commit.outputs.commit_sha }}
          **Commit Author**: ${{ steps.commit.outputs.commit_author }}
          **Commit Message**: ${{ steps.commit.outputs.commit_message }}
          
          ### 🚀 Auto-compiled binaries
          
          This is an automatic canary release compiled from the latest main branch.
          
          ### 📦 Downloads
          
          - **Linux**: SDEP-Linux.tar.gz
          
          ### 🔐 Default Credentials
          
          - **Username**: admin
          - **Password**: Admin123!
          
          ### ⚠️ Important
          
          Change the default password immediately after first login.
          
          ---
          
          *Built with GitHub Actions*
        files: |
          build/SDEP-Linux.tar.gz
        draft: false
        prerelease: true
        generate_release_notes: true
        fail_on_missing: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}