# =============================================================================
# Release Firmada - Firma Masiva Profunda en DOS PASADAS (Windows)
# =============================================================================
#
# ESTRATEGIA DE FIRMA (por qué hay DOS pasadas):
#   PASADA 1 (antes de Inno Setup): firma RECURSIVAMENTE todo el contenido de
#     dist\ (aplicación completa: .exe, .dll, .pyd, ...) y dist_updater\.
#     Así, cuando Inno Setup empaqueta, TODOS los archivos que van DENTRO del
#     instalador ya llevan su firma Authenticode incrustada.
#   PASADA 2 (después de Inno Setup): firma el INSTALADOR final generado
#     (dist_installer\Instalador_SDEP_CPP5.exe) y cualquier otro binario que
#     haya aparecido en dist_installer. Inno Setup además firma el
#     desinstalador (SignedUninstaller=yes) con el mismo certificado.
#
#   Selección del certificado (CRÍTICO): el PFX lleva la cadena completa y
#   VARIAS de sus entidades (raíz, intermedios y hoja) resultan "aptas para
#   firmar" a ojos de signtool. Si no se fija QUÉ certificado firma,
#   signtool aborta con "Multiple certificates were found that meet all the
#   given criteria" (fallo del run #58). Por eso la validación detecta la
#   huella del certificado hoja (SIGN_CERT_SHA1) y TODAS las llamadas firman
#   con /sha1 <huella>; /a queda solo como fallback.
#
#   Auditoría final: si queda UN solo archivo firmable sin firma, el pipeline
#   FALLA (no se publica nada sin firmar).
#
#   Nota de verificación: al ser una CA PRIVADA, en el runner el estado de
#   WinVerifyTrust suele ser 'NotTrusted' o 'UnknownError' (la raíz no está
#   instalada y no hay servidores de revocación) AUNQUE la firma esté
#   perfectamente incrustada (signtool reporta "Successfully signed" con 0
#   errores). Por eso TODAS las verificaciones del pipeline se basan en el
#   CERTIFICADO FIRMANTE incrustado (SignerCertificate), no en el estado de
#   confianza.
#
#   La Release publicada contiene UN SOLO archivo:
#     - SistemaGestionPersonal-Setup-<versión>.exe (instalador firmado; el
#       actualizador ya va incluido DENTRO del instalador).
#
# Disparadores:
#   - Push a main (release continua firmada, etiqueta continuous-vX.Y.N)
#   - Push de etiquetas de versión (v*)
#   - Ejecución manual (workflow_dispatch)
#
# build.yml ya NO publica releases: solo compila y verifica. Este workflow
# es el ÚNICO que publica releases, y SIEMPRE con todos los archivos firmados.
#
# Secretos requeridos (Settings -> Secrets and variables -> Actions -> Actions):
#   PFX_BASE64    : Certificado PFX con la cadena de confianza completa (4
#                   niveles) codificado en Base64. Generarlo con:
#                     [Convert]::ToBase64String(
#                       [IO.File]::ReadAllBytes("C:\ruta\CadenaEnterpriseFirma.pfx"))
#   PFX_PASSWORD  : Contraseña del archivo PFX.
#   (Si antes usabas CODE_SIGN_CERT_BASE64 / CODE_SIGN_CERT_PASSWORD, crea
#    estos dos nuevos secretos: el workflow YA NO lee los antiguos.)
#
# Seguridad: el PFX se restaura en RUNNER_TEMP, se valida (contraseña y
# cadena) y se BORRA forzosamente en un paso con `if: always()` aunque el
# job falle. La contraseña nunca se imprime en el log (GitHub la enmascara).
# =============================================================================

name: Release Firmada (Firma Masiva Profunda)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Compilar, firmar masivamente y publicar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUNBUFFERED: "1"
      # Nombre físico del certificado restaurado en el runner
      PFX_FILE: CadenaEnterpriseFirma.pfx
      # NOTA: PFX_BASE64 y PFX_PASSWORD (secrets del repositorio) ya NO se
      # inyectan a nivel de job: se pasan SOLO a los pasos que los usan
      # (restauración/importación del PFX, ISCC y las dos pasadas de firma).

    steps:
      # -------------------------------------------------------------------------
      # 1. Clonar repositorio y preparar entorno Python
      # -------------------------------------------------------------------------
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python (Windows)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # -------------------------------------------------------------------------
      # 2. Determinar versión y generar información de build
      # -------------------------------------------------------------------------
      - name: Determinar versión y generar información de build
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            # Push de etiqueta v*: la versión sale de la etiqueta (v1.0.0 -> 1.0.0)
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
            $tagFinal = $env:GITHUB_REF_NAME
          } else {
            # Push a main o ejecución manual: release continua con la versión
            # del archivo VERSION. El tag NO empieza por "v" a propósito, para
            # no volver a disparar este workflow (su trigger de etiquetas solo
            # escucha v*). Misma convención que usaba build.yml.
            $ver = (Get-Content -Path VERSION).Trim()
            $tagFinal = "continuous-v$ver.$env:GITHUB_RUN_NUMBER"
          }
          $commit = $env:GITHUB_SHA.Substring(0, [Math]::Min(7, $env:GITHUB_SHA.Length))
          $contenido = @"
          """Generado automaticamente por CI. No editar."""
          BUILD_VERSION = "$ver"
          BUILD_COMMIT = "$commit"
          BUILD_DATE = "$(Get-Date -Format o)"
          "@
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) "src\config\build_info.py"),
            $contenido,
            [Text.UTF8Encoding]::new($false)
          )
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "RELEASE_TAG=$tagFinal" >> $env:GITHUB_ENV
          Write-Host "Versión: $ver | Etiqueta: $tagFinal | Commit: $commit"

      # -------------------------------------------------------------------------
      # 3. Compilar ejecutable principal (PyInstaller onedir) y renombrarlo
      # -------------------------------------------------------------------------
      - name: Compilar ejecutable (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean spec/app.spec

      - name: Renombrar ejecutable principal a SDEP_CPP5.exe
        run: |
          $exe = "dist\SistemaGestionPersonal\SistemaGestionPersonal.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "El ejecutable no fue generado: $exe"
            exit 1
          }
          Rename-Item -Path $exe -NewName "SDEP_CPP5.exe"
          Write-Host "OK: dist\SistemaGestionPersonal\SDEP_CPP5.exe"

      # -------------------------------------------------------------------------
      # 4. Compilar actualizador automático
      # -------------------------------------------------------------------------
      - name: Compilar actualizador automático (SDEP_CPP5_AutoUpdater.exe)
        run: |
          python -m PyInstaller --noconfirm --clean updater/updater.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\SDEP_CPP5_AutoUpdater.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "El actualizador no fue generado: $exe"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist_updater" | Out-Null
          Move-Item -Force $exe "dist_updater\SDEP_CPP5_AutoUpdater.exe"
          Write-Host "OK actualizador: dist_updater\SDEP_CPP5_AutoUpdater.exe"

      # -------------------------------------------------------------------------
      # 5. Restaurar, VALIDAR el certificado PFX, IMPORTARLO en los almacenes
      #    de usuario (Cert:\CurrentUser\My y Cert:\CurrentUser\CA) y DETECTAR
      #    la huella del certificado de firma (hoja) - fail-fast
      #    - Si la contraseña es incorrecta o el Base64 está corrupto, el
      #      pipeline se detiene AQUÍ con un mensaje claro.
      #    - La importación en My/CA es OBLIGATORIA: es lo que permite que la
      #      ventana de propiedades de Windows muestre la cadena de
      #      certificación completa (4 niveles) y válida de cada binario.
      #    - Se detecta el certificado hoja del PFX: sin fijarlo, signtool
      #      falla con "Multiple certificates were found that meet all the
      #      given criteria", porque TODA la cadena resulta "apta para firmar".
      # -------------------------------------------------------------------------
      - name: Restaurar, validar e importar el PFX (CurrentUser\My y CA) y detectar el certificado de firma (hoja)
        env:
          # Secrets del repositorio inyectados SOLO en este paso.
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Error "FALTA el secreto PFX_BASE64. Crealo en Settings -> Secrets and variables -> Actions (PFX en Base64)."
            exit 1
          }
          if (-not $env:PFX_PASSWORD) {
            Write-Error "FALTA el secreto PFX_PASSWORD. Crealo en Settings -> Secrets and variables -> Actions."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP $env:PFX_FILE
          # Decodificar Base64 -> bytes -> archivo físico temporal
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          } catch {
            Write-Error "PFX_BASE64 no es un Base64 válido: $($_.Exception.Message)"
            exit 1
          }
          # Validación REAL: abrir el PFX con la contraseña y contar la cadena.
          # Si la contraseña es incorrecta, esto lanza excepción -> error claro.
          try {
            $cadena = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $cadena.Import($pfxPath, $env:PFX_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
          } catch {
            Write-Error "El PFX NO se pudo abrir (¿PFX_PASSWORD incorrecta o PFX corrupto?): $($_.Exception.Message)"
            exit 1
          }
          if ($cadena.Count -eq 0) {
            Write-Error "El PFX no contiene ningún certificado"
            exit 1
          }
          Write-Output "CERT_PFX=$pfxPath" >> $env:GITHUB_ENV
          Write-Host "PFX válido: $pfxPath ($([math]::Round((Get-Item $pfxPath).Length/1KB,1)) KB) con $($cadena.Count) certificado(s) en la cadena:"
          foreach ($c in $cadena) {
            Write-Host ("  - {0} | huella {1}" -f $c.Subject, $c.Thumbprint)
          }
          # ----------------------------------------------------------------
          # DETECCIÓN AUTOMÁTICA del certificado de firma (hoja).
          # El PFX trae raíz + intermedios + hoja y VARIOS resultan "aptos
          # para firmar"; sin fijar uno, signtool falla con
          # "Multiple certificates were found that meet all the given
          # criteria". Criterio, en orden:
          #   1. Único cert con EKU Code Signing (1.3.6.1.5.5.7.3.3) y clave.
          #   2. Único end-entity con clave privada, Subject != Issuer y sin
          #      Basic Constraints CA=true (no es una CA).
          # La huella se exporta como SIGN_CERT_SHA1 y todas las llamadas de
          # firma la fijan con /sha1 (fallback: /a si no se pudo detectar).
          # ----------------------------------------------------------------
          $conCodeSigning = @($cadena | Where-Object {
            $_.HasPrivateKey -and (@($_.Extensions |
              Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
              ForEach-Object { $_.EnhancedKeyUsages } |
              ForEach-Object { $_.Value }) -contains '1.3.6.1.5.5.7.3.3')
          })
          $endEntities = @($cadena | Where-Object {
            $_.HasPrivateKey -and ($_.Subject -ne $_.Issuer)
          } | Where-Object {
            $bc = $_.Extensions |
              Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension] } |
              Select-Object -First 1
            (-not $bc) -or (-not $bc.CertificateAuthority)
          })
          $hoja = $null
          if ($conCodeSigning.Count -eq 1) {
            $hoja = $conCodeSigning[0]
            Write-Host "Detección: único certificado con EKU Code Signing y clave privada."
          } elseif ($endEntities.Count -eq 1) {
            $hoja = $endEntities[0]
            Write-Host "Detección: único end-entity (no CA) con clave privada."
          } elseif ($conCodeSigning.Count -gt 1 -or $endEntities.Count -gt 1) {
            Write-Warning "Detección ambigua (code-signing: $($conCodeSigning.Count), end-entity: $($endEntities.Count)); NO se fija /sha1 y signtool usará /a."
          } else {
            Write-Warning "No se detectó ningún certificado hoja con clave privada; signtool usará /a."
          }
          if ($hoja) {
            Write-Output "SIGN_CERT_SHA1=$($hoja.Thumbprint)" >> $env:GITHUB_ENV
            Write-Host ("CERTIFICADO DE FIRMA SELECCIONADO: {0} | huella SHA1 {1}" -f $hoja.Subject, $hoja.Thumbprint)
          }
          # ----------------------------------------------------------------
          # IMPORTACIÓN OBLIGATORIA del PFX en los almacenes de usuario:
          #   - Cert:\CurrentUser\My : toda la cadena; la hoja queda CON su
          #     clave privada persistida en disco.
          #   - Cert:\CurrentUser\CA : raíz e intermedios (CryptoAPI usa este
          #     almacén para construir y MOSTRAR la cadena completa en la
          #     ventana de propiedades de cada binario firmado).
          # Importar en almacenes CurrentUser NO requiere elevación en el
          # runner. La limpieza final (if: always()) purga AMBOS almacenes
          # con PFX_THUMBPRINTS.
          # ----------------------------------------------------------------
          $claveSegura = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          try {
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $claveSegura | Out-Null
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\CA -Password $claveSegura | Out-Null
          } catch {
            Write-Error "No se pudo importar el PFX en los almacenes de usuario (My/CA): $($_.Exception.Message)"
            exit 1
          }
          Write-Host "PFX importado en Cert:\CurrentUser\My y Cert:\CurrentUser\CA"
          # Comprobación dura: la hoja debe quedar en My CON clave privada.
          $huellasPfx = @($cadena | ForEach-Object Thumbprint)
          $hojaEnMy = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.HasPrivateKey -and ($_.Thumbprint -in $huellasPfx) } |
            Where-Object { (-not $hoja) -or ($_.Thumbprint -eq $hoja.Thumbprint) } |
            Select-Object -First 1
          if (-not $hojaEnMy) {
            Write-Error "La importación a Cert:\CurrentUser\My falló: el certificado de firma no quedó disponible con clave privada"
            exit 1
          }
          # Construir y mostrar la cadena (raíz -> intermedios -> hoja) tal y
          # como la mostrará Windows en las propiedades del archivo firmado.
          $cadenaAlmacen = New-Object System.Security.Cryptography.X509Certificates.X509Chain
          $cadenaAlmacen.ChainPolicy.RevocationMode = 'NoCheck'
          $null = $cadenaAlmacen.Build($hojaEnMy)
          Write-Host ("Cadena construida en el almacén: {0} nivel(es)" -f $cadenaAlmacen.ChainElements.Count)
          for ($i = 0; $i -lt $cadenaAlmacen.ChainElements.Count; $i++) {
            $nivel = $cadenaAlmacen.ChainElements[$i].Certificate
            Write-Host ("  Nivel {0}: {1} (huella {2})" -f ($i + 1), $nivel.Subject, $nivel.Thumbprint)
          }
          if ($cadenaAlmacen.ChainElements.Count -lt 3) {
            Write-Warning "La cadena construida tiene menos de 3 niveles: verifica que el PFX incluya raíz e intermedios."
          }
          # Huellas de TODA la cadena: la limpieza final (if: always()) las usa
          # para purgar de los almacenes del runner (My y CA) los certificados
          # que esta validación importó (DefaultKeySet/Import-PfxCertificate
          # persisten las claves privadas en Cert:\CurrentUser\My).
          $huellas = ($cadena | ForEach-Object { $_.Thumbprint }) -join ','
          Write-Output "PFX_THUMBPRINTS=$huellas" >> $env:GITHUB_ENV
          # ----------------------------------------------------------------
          # EXPORTAR la CADENA COMPLETA como certificados públicos para el
          # instalador (tools/cert_01.cer ... tools/cert_04.cer). Los .cer
          # versionados pueden quedar DESACTUALIZADOS (p. ej. tras una
          # rotación de CA): si el instalador empaquetara certs que NO
          # corresponden a esta cadena, las firmas NUNCA serían de
          # confianza en los equipos cliente. Mapeo por posición en la
          # cadena construida (ChainElements[0] = HOJA, último = RAÍZ):
          #   [0] hoja de firma           -> cert_04.cer (NO se instala:
          #       viaja incrustada en los ejecutables firmados)
          #   [1] issuing CA              -> cert_03.cer (LocalMachine\CA)
          #   [2] intermedio de política  -> cert_02.cer (LocalMachine\CA)
          #   [3] raíz autofirmada        -> cert_01.cer (LocalMachine\Root)
          # ----------------------------------------------------------------
          if ($cadenaAlmacen.ChainElements.Count -eq 4) {
            $rolesCer = @('cert_04.cer', 'cert_03.cer', 'cert_02.cer', 'cert_01.cer')
            for ($i = 0; $i -lt 4; $i++) {
              $destinoCer = Join-Path (Get-Location) (Join-Path 'tools' $rolesCer[$i])
              [IO.File]::WriteAllBytes($destinoCer, $cadenaAlmacen.ChainElements[$i].Certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Write-Host ("CERTIFICADO {0} exportado a tools/{1}: {2} (huella {3})" -f $rolesCer[$i], $rolesCer[$i], $cadenaAlmacen.ChainElements[$i].Certificate.Subject, $cadenaAlmacen.ChainElements[$i].Certificate.Thumbprint)
            }
          } else {
            Write-Warning "La cadena del PFX no tiene 4 niveles; el instalador usará los .cer versionados de tools/"
          }

      # -------------------------------------------------------------------------
      # 6. Localizar signtool.exe (Windows SDK preinstalado en el runner)
      # -------------------------------------------------------------------------
      - name: Localizar signtool.exe (Windows SDK)
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $raices = @(
              "C:\Program Files (x86)\Windows Kits\10\bin",
              "C:\Program Files\Windows Kits\10\bin"
            )
            $signtool = Get-ChildItem $raices -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) {
            Write-Error "signtool.exe no encontrado (¿falta el Windows SDK?)"
            exit 1
          }
          Write-Output "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          Write-Host "signtool: $signtool"

      # -------------------------------------------------------------------------
      # 7. Preparar módulo de firma reutilizable (lo usan la PASADA 1 y la 2)
      #    Firma cada archivo con parámetros estrictos y VERIFICA la firma
      #    incrustada. Devuelve código de salida != 0 si ALGO falla.
      # -------------------------------------------------------------------------
      - name: Preparar módulo de firma (Sign-Masivo.ps1)
        run: |
          $helper = Join-Path $env:RUNNER_TEMP "Sign-Masivo.ps1"
          @'
          param(
            [Parameter(Mandatory = $true)][string] $SignTool,
            [Parameter(Mandatory = $true)][string] $PfxPath,
            [Parameter(Mandatory = $true)][string] $Password,
            [Parameter(Mandatory = $true)][string[]] $Dirs,
            [string] $Etiqueta = "FIRMA",
            # Huella SHA1 del certificado hoja detectado en la validación del
            # PFX. Si viene, se firma con /sha1 (selección determinista); si
            # viene vacía, se usa /a como fallback.
            [string] $LeafSha1 = ""
          )

          # Lista completa de extensiones soportadas por Authenticode.
          # .pyd incluido: son las DLLs de extension Python que PyInstaller
          # genera (sin firmarlas, algunos AV marcan la app como sospechosa).
          $extensiones = @(
            '*.exe', '*.dll', '*.pyd', '*.sys', '*.ocx', '*.scr', '*.cpl',
            '*.msi', '*.msm', '*.msp', '*.cab',
            '*.appx', '*.appxbundle', '*.msix', '*.msixbundle',
            '*.cat', '*.ps1', '*.psm1', '*.psd1', '*.vbs'
          )

          $dirsExistentes = $Dirs | Where-Object { Test-Path $_ }
          if (-not $dirsExistentes) {
            Write-Host "[$Etiqueta] Sin directorios que firmar: $($Dirs -join ', ')"
            exit 0
          }

          # Búsqueda RECURSIVA y profunda: incluye todos los subdirectorios
          $archivos = Get-ChildItem -Path $dirsExistentes -Recurse -Include $extensiones -File |
            Select-Object -ExpandProperty FullName -Unique

          if (-not $archivos) {
            Write-Host "[$Etiqueta] Sin archivos firmables en: $($dirsExistentes -join ', ')"
            exit 0
          }

          Write-Host "=== [$Etiqueta] FIRMA MASIVA: $($archivos.Count) archivo(s) detectados ==="
          $firmados = 0
          $fallidos = 0

          foreach ($archivo in $archivos) {
            Write-Host "  Firmando: $archivo"
            # Selección del certificado de firma (CLAVE para un PFX con la
            # cadena completa, donde varios certificados son "aptos para firmar"):
            #   /sha1 <huella> : usa EXACTAMENTE el certificado hoja detectado
            #   /a             : fallback si no se detectó la huella
            # Parámetros estrictos:
            #   /f  : PFX con la cadena de confianza completa
            #   /p  : contraseña del PFX
            #   /fd : digest del archivo SHA-256
            #   /tr : timestamping RFC3161 oficial (DigiCert)
            #   /td : SHA-256 para el timestamp
            #   /v  : salida verbosa en el log
            # Tanto /sha1 como /a incrustan TODA la cadena del PFX que encadena
            # con el certificado que firma.
            $seleccion = if ($LeafSha1) { @('/sha1', "$LeafSha1") } else { @('/a') }
            if ($LeafSha1) {
              Write-Host "  Selección de certificado: /sha1 $LeafSha1"
            } else {
              Write-Host "  Selección de certificado: /a (automática)"
            }
            & $SignTool sign @seleccion /f "$PfxPath" /p "$Password" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /v "$archivo" 2>&1 | ForEach-Object { Write-Host "    $_" }

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "  [$Etiqueta] FALLO al firmar (exit $LASTEXITCODE): $archivo"
              $fallidos++
              continue
            }

            # VERIFICACIÓN de la firma incrustada.
            # IMPORTANTE: el certificado es de una CA PRIVADA; en el runner esa
            # raíz no está instalada y no hay CRL/OCSP, así que WinVerifyTrust
            # suele devolver 'NotTrusted' o 'UnknownError' AUNQUE la firma esté
            # perfectamente incrustada (signtool ya reportó "Successfully
            # signed" con 0 errores). El criterio fiable es el CERTIFICADO
            # FIRMANTE incrustado:
            #   - Debe existir (SignerCertificate != null).
            #   - Debe ser EXACTAMENTE el certificado hoja detectado (si hay
            #     huella esperada en -LeafSha1).
            #   - HashMismatch = firma corrupta -> fallo.
            $sig = Get-AuthenticodeSignature -FilePath $archivo
            $estado = $sig.Status
            $firmante = $sig.SignerCertificate
            $firmanteOk = ($null -ne $firmante) -and ((-not $LeafSha1) -or ($firmante.Thumbprint -eq $LeafSha1))
            if ($firmanteOk -and $estado -ne 'HashMismatch') {
              Write-Host "  OK firmado (estado WinVerifyTrust: $estado | firmante: $($firmante.Thumbprint)): $(Split-Path $archivo -Leaf)"
              $firmados++
            } elseif ($null -eq $firmante) {
              Write-Warning "  [$Etiqueta] SIN FIRMA incrustada (estado: $estado): $archivo"
              $fallidos++
            } else {
              Write-Warning "  [$Etiqueta] Firma no válida (estado: $estado, firmante: $($firmante.Thumbprint), esperado: $LeafSha1): $archivo"
              $fallidos++
            }
          }

          Write-Host "=== [$Etiqueta] RESUMEN: $firmados firmados / $fallidos fallidos / $($archivos.Count) total ==="
          if ($fallidos -gt 0) { exit 1 }
          exit 0
          '@ | Set-Content -Path $helper -Encoding UTF8
          Write-Host "Módulo de firma listo: $helper"

      # -------------------------------------------------------------------------
      # 8. PASADA 1 - FIRMA PROFUNDA del PAYLOAD (dist + dist_updater)
      #    TODO lo que va DENTRO del instalador queda firmado AQUÍ.
      # -------------------------------------------------------------------------
      - name: "PASADA 1: firma profunda de dist y dist_updater"
        env:
          # Secret del repositorio inyectado SOLO en este paso.
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          & (Join-Path $env:RUNNER_TEMP "Sign-Masivo.ps1") `
            -SignTool "$env:SIGNTOOL" `
            -PfxPath "$env:CERT_PFX" `
            -Password "$env:PFX_PASSWORD" `
            -LeafSha1 "$env:SIGN_CERT_SHA1" `
            -Dirs @('dist', 'dist_updater') `
            -Etiqueta "PASADA-1-PAYLOAD"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "La PASADA 1 terminó con fallos de firma (ver warnings arriba)"
            exit 1
          }

      # -------------------------------------------------------------------------
      # 9. Verificación dura del ejecutable principal
      # -------------------------------------------------------------------------
      - name: Verificar firma del ejecutable principal
        run: |
          $principal = "dist\SistemaGestionPersonal\SDEP_CPP5.exe"
          $sig = Get-AuthenticodeSignature -FilePath $principal
          # Con una CA privada, el estado de WinVerifyTrust en el runner suele
          # ser NotTrusted/UnknownError aunque la firma esté bien: el criterio
          # fiable es el certificado firmante incrustado.
          [PSCustomObject]@{
            Estado          = $sig.Status
            EstadoDetallado = $sig.StatusMessage
            Firmante        = $sig.SignerCertificate.Subject
            Huella          = $sig.SignerCertificate.Thumbprint
          } | Format-List
          # CADENA COMPLETA del firmante: como el PFX ya está importado en
          # Cert:\CurrentUser\My y Cert:\CurrentUser\CA, esta es exactamente
          # la cadena (raíz -> intermedios -> hoja) que mostrará la ventana de
          # propiedades de Windows para el binario firmado.
          $cadenaFirmante = New-Object System.Security.Cryptography.X509Certificates.X509Chain
          $cadenaFirmante.ChainPolicy.RevocationMode = 'NoCheck'
          $null = $cadenaFirmante.Build($sig.SignerCertificate)
          Write-Host ("Cadena de certificación incrustada: {0} nivel(es)" -f $cadenaFirmante.ChainElements.Count)
          for ($i = 0; $i -lt $cadenaFirmante.ChainElements.Count; $i++) {
            $nivel = $cadenaFirmante.ChainElements[$i].Certificate
            Write-Host ("  Nivel {0}: {1} (huella {2})" -f ($i + 1), $nivel.Subject, $nivel.Thumbprint)
          }
          if ($null -eq $sig.SignerCertificate) {
            Write-Error "El ejecutable principal NO quedó firmado (Status: $($sig.Status))"
            exit 1
          }
          if ($sig.Status -eq 'HashMismatch') {
            Write-Error "El ejecutable principal tiene la firma CORRUPTA (HashMismatch)"
            exit 1
          }
          if ($env:SIGN_CERT_SHA1 -and $sig.SignerCertificate.Thumbprint -ne $env:SIGN_CERT_SHA1) {
            Write-Error "El ejecutable principal fue firmado con un certificado inesperado: $($sig.SignerCertificate.Thumbprint) (esperado: $env:SIGN_CERT_SHA1)"
            exit 1
          }
          Write-Host "OK: ejecutable principal firmado por '$($sig.SignerCertificate.Subject)' (estado WinVerifyTrust en el runner: $($sig.Status))"

      # -------------------------------------------------------------------------
      # 10. Compilar instalador con Inno Setup
      #     - Empaqueta los archivos YA FIRMADOS de la PASADA 1.
      #     - Firma el instalador y el desinstalador: el Sign Tool 'GitHubSign'
      #       se REGISTRA aquí vía /S"GitHubSign=..." (la directiva SignTool de
      #       Inno no admite comandos inline) y setup.iss solo lo referencia.
      # -------------------------------------------------------------------------
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador firmado (ISCC con parámetros de firma)
        env:
          # Secret del repositorio inyectado SOLO en este paso (Inno lo usa
          # para firmar instalador y desinstalador).
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe (Inno Setup 6) no encontrado"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          # ----------------------------------------------------------------------
          # Registro del Sign Tool para Inno Setup (opción /S de ISCC).
          # La directiva SignTool de Inno NO admite el comando inline: exige un
          # NOMBRE previamente registrado (vía /S de ISCC o el IDE); si el nombre
          # no está registrado, falla con "Value of [Setup] section directive
          # 'SignTool' is invalid". Por eso el comando completo se registra AQUÍ
          # y setup.iss solo hace 'SignTool=GitHubSign'.
          #
          # Placeholders de Inno (van LITERALES en la cadena; por eso se usa
          # comillas simples y concatenación, para que PowerShell no los expanda):
          #   $q -> comilla doble | $f -> ruta del archivo a firmar (con comillas)
          #
          # Selección del certificado: /sha1 con la huella hoja detectada
          # (determinista) o /a como fallback. Sin /sha1 o /a, signtool falla con
          # "Multiple certificates were found that meet all the given criteria":
          # el PFX trae la cadena completa y VARIOS certificados resultan "aptos
          # para firmar".
          # ----------------------------------------------------------------------
          $seleccionInno = if ($env:SIGN_CERT_SHA1) { '/sha1 ' + $env:SIGN_CERT_SHA1 } else { '/a' }
          $ghSign = '$q' + $env:SIGNTOOL + '$q sign ' + $seleccionInno +
            ' /f $q' + $env:CERT_PFX + '$q /p ' + $env:PFX_PASSWORD +
            ' /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f'
          & $iscc `
            "/DMyAppVersion=$env:APP_VERSION" `
            "/DMyVersionInfo=$env:APP_VERSION" `
            "/DMyAppName=SDEP_CPP5" `
            "/DMyAppExeName=SDEP_CPP5.exe" `
            "/DMyOutputBaseFilename=SistemaGestionPersonal-Setup-$env:APP_VERSION" `
            "/DConFirmaCI=1" `
            "/SGitHubSign=$ghSign" `
            "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -------------------------------------------------------------------------
      # 11. PASADA 2 - FIRMA del INSTALADOR FINAL (dist_installer)
      #     El instalador se genera DESPUÉS de la pasada 1, por eso necesita
      #     su propia pasada: aquí queda firmado el .exe que se publica.
      # -------------------------------------------------------------------------
      - name: "PASADA 2: firma del instalador final (dist_installer)"
        env:
          # Secret del repositorio inyectado SOLO en este paso.
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if (-not (Test-Path "dist_installer")) {
            Write-Error "No existe dist_installer: Inno Setup no generó salida"
            exit 1
          }
          & (Join-Path $env:RUNNER_TEMP "Sign-Masivo.ps1") `
            -SignTool "$env:SIGNTOOL" `
            -PfxPath "$env:CERT_PFX" `
            -Password "$env:PFX_PASSWORD" `
            -LeafSha1 "$env:SIGN_CERT_SHA1" `
            -Dirs @('dist_installer') `
            -Etiqueta "PASADA-2-INSTALADOR"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "La PASADA 2 terminó con fallos de firma (ver warnings arriba)"
            exit 1
          }

      # -------------------------------------------------------------------------
      # 12. AUDITORÍA FINAL: cero problemas de firma.
      #     Falla si algún archivo firmable quedó SIN FIRMA, con la firma
      #     corrupta (HashMismatch) o firmado con un certificado distinto al
      #     hoja detectado. No se publica nada con problemas.
      # -------------------------------------------------------------------------
      - name: Auditoría final (ningún archivo sin firmar)
        run: |
          $extensiones = @(
            '*.exe', '*.dll', '*.pyd', '*.sys', '*.ocx', '*.scr', '*.cpl',
            '*.msi', '*.msm', '*.msp', '*.cab',
            '*.appx', '*.appxbundle', '*.msix', '*.msixbundle',
            '*.cat', '*.ps1', '*.psm1', '*.psd1', '*.vbs'
          )
          # Criterio de auditoría: el CERTIFICADO FIRMANTE incrustado, no el
          # estado de WinVerifyTrust (con una CA privada, en el runner ese
          # estado suele ser NotTrusted/UnknownError aunque la firma esté bien).
          $esperada = $env:SIGN_CERT_SHA1
          $problemas = @()
          $total = 0
          $archivosAuditoria = @(Get-ChildItem -Path 'dist', 'dist_updater', 'dist_installer' `
            -Recurse -Include $extensiones -File -ErrorAction SilentlyContinue)
          foreach ($archivo in $archivosAuditoria) {
            $total++
            $sig = Get-AuthenticodeSignature -FilePath $archivo.FullName
            if ($null -eq $sig.SignerCertificate) {
              Write-Warning "SIN FIRMAR: $($archivo.FullName)"
              $problemas += "SIN FIRMAR: $($archivo.FullName)"
            } elseif ($sig.Status -eq 'HashMismatch') {
              Write-Warning "FIRMA CORRUPTA (HashMismatch): $($archivo.FullName)"
              $problemas += "FIRMA CORRUPTA (HashMismatch): $($archivo.FullName)"
            } elseif ($esperada -and $sig.SignerCertificate.Thumbprint -ne $esperada) {
              Write-Warning "FIRMADO CON OTRO CERTIFICADO ($($sig.SignerCertificate.Thumbprint)): $($archivo.FullName)"
              $problemas += "FIRMADO CON OTRO CERTIFICADO: $($archivo.FullName)"
            }
          }

          Write-Host "Auditoría: $total archivo(s) firmables, $($problemas.Count) problema(s)"
          if ($problemas.Count -gt 0) {
            Write-Error "Quedan $($problemas.Count) problema(s) de firma: NO se publica la release"
            exit 1
          }
          Write-Host "OK: TODOS los archivos firmables llevan firma Authenticode incrustada"

      # -------------------------------------------------------------------------
      # 13. LIMPIEZA DE SEGURIDAD: borrar el PFX SIEMPRE (if: always())
      #     Borrado forzado (sobrescribir con ceros + Remove-Item -Force),
      #     se ejecute o no el resto del pipeline con éxito.
      # -------------------------------------------------------------------------
      - name: Eliminar certificado PFX del runner (seguridad)
        if: always()
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP $env:PFX_FILE
          if (Test-Path $pfxPath) {
            # Sobrescribir con ceros antes de borrar (borrado forzado)
            $bytes = [byte[]]::new((Get-Item $pfxPath).Length)
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            Remove-Item $pfxPath -Force
            Write-Host "OK: $env:PFX_FILE sobrescrito y eliminado del runner"
          } else {
            Write-Host "El PFX ya no existe en el runner"
          }
          # Purgar de los almacenes del usuario los certificados que la
          # validación importó con Import-PfxCertificate (My: hoja con clave
          # privada persistida; CA: raíz e intermedios). Best-effort: si algo
          # falla aquí no debe romper el job.
          if ($env:PFX_THUMBPRINTS) {
            foreach ($almacen in @('My', 'CA')) {
              foreach ($tp in ($env:PFX_THUMBPRINTS -split ',')) {
                $tp = $tp.Trim()
                if (-not $tp) { continue }
                $rutaCert = "Cert:\CurrentUser\$almacen\$tp"
                if (Test-Path $rutaCert) {
                  # -DeleteKey borra también la clave privada persistida (My)
                  Remove-Item $rutaCert -Force -DeleteKey -ErrorAction SilentlyContinue
                  Write-Host "  Purgado Cert:\CurrentUser\$almacen : $tp"
                }
              }
            }
          }

      # -------------------------------------------------------------------------
      # 14. Publicar Release con el instalador firmado
      # -------------------------------------------------------------------------
      - name: Limpiar release/etiqueta previa con el mismo nombre (auto-sanado)
        run: |
          # Si YA existe una release/etiqueta con este nombre (p. ej. creada
          # antes por el workflow antiguo con archivos SIN FIRMAR), se elimina
          # para que la release firmada no choque con ella ni herede sus
          # archivos viejos (softprops salta los assets con nombre duplicado:
          # sin este paso, el Setup firmado NUNCA se subiría).
          #
          # FIX (exit code 1): el runner de Actions añade SIEMPRE al final de
          # cada paso pwsh `exit $LASTEXITCODE`. Si el ÚLTIMO comando nativo
          # del paso falló (aquí: `gh release view` cuando la release NO
          # existe -> exit 1, caso ESPERADO), el paso muere aunque la lógica
          # sea correcta. Por eso cada código se captura en una variable y la
          # ejecución termina con `exit 0` EXPLÍCITO en todas las ramas.
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          gh release view "$env:RELEASE_TAG" -R "$env:GITHUB_REPOSITORY" *> $null
          $exeView = $LASTEXITCODE
          if ($exeView -eq 0) {
            gh release delete "$env:RELEASE_TAG" -R "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
            $exeDelete = $LASTEXITCODE
            if ($exeDelete -eq 0) {
              Write-Host "Eliminada release/etiqueta previa: $env:RELEASE_TAG"
            } else {
              Write-Warning "No se pudo eliminar la release previa (exit $exeDelete); se continúa: softprops creará la release nueva"
            }
          } elseif ($exeView -eq 1) {
            # Caso esperado: NO existe release/etiqueta previa. No es error:
            # softprops/action-gh-release creará la release con su etiqueta.
            Write-Host "No hay release previa con la etiqueta $env:RELEASE_TAG (gh release view: exit $exeView). Continuando."
          } else {
            # Fallo inesperado (red/permisos/rate-limit): se reporta, pero no
            # detiene la publicación.
            Write-Warning "gh release view terminó con exit inesperado $exeView; se continúa"
          }
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Adjuntar artefactos firmados a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist_installer/SistemaGestionPersonal-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
