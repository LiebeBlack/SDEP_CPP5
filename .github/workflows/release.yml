name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Verify source files
      run: |
        Write-Host "Checking source files..."
        if (Test-Path "src/main.py") {
          Write-Host "✓ src/main.py exists"
        } else {
          Write-Host "✗ src/main.py not found"
          exit 1
        }
    
    - name: Build executable
      run: |
        Write-Host "Building executable..."
        pyinstaller --onefile --windowed --name=SistemaGestionPersonal --add-data="src;src" --hidden-import=customtkinter --hidden-import=PIL --hidden-import=reportlab --hidden-import=SQLAlchemy --hidden-import=pydantic --hidden-import=pydantic_core --hidden-import=typing_extensions --hidden-import=python_dotenv --clean src/main.py
        if (Test-Path "dist/SistemaGestionPersonal.exe") {
          Write-Host "✓ Executable created successfully"
          $size = (Get-Item "dist/SistemaGestionPersonal.exe").Length / 1MB
          Write-Host "File size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Host "✗ Executable not found"
          exit 1
        }
    
    - name: Create package
      run: |
        Write-Host "Creating ZIP package..."
        Compress-Archive -Path dist\SistemaGestionPersonal.exe -DestinationPath SistemaGestionPersonal-Windows.zip -Force
        if (Test-Path "SistemaGestionPersonal-Windows.zip") {
          Write-Host "✓ ZIP created successfully"
          $size = (Get-Item "SistemaGestionPersonal-Windows.zip").Length / 1MB
          Write-Host "ZIP size: $([math]::Round($size, 2)) MB"
        } else {
          Write-Host "✗ ZIP not found"
          exit 1
        }
    
    - name: Create version
      id: version
      run: |
        if ("${{ github.event.inputs.version }}" -ne "") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "1.0.0-${{ github.run_number }}"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"
    
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        files: SistemaGestionPersonal-Windows.zip
        draft: false
        prerelease: true
        body: |
          Release v${{ steps.version.outputs.version }} del Sistema de Gestión de Personal.
          
          Este es un release automático generado por push a main.
          
          ## 📦 Installation
          Download the Windows executable from the assets below.
          
          ## 🔧 System Requirements
          - Windows 10/11
          - 4GB RAM minimum
          - 500MB disk space
          
          ---
          *Auto-generated release*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}