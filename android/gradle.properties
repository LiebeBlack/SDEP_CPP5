org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 en modo completo: menos clases y menos recursos en el APK, que es lo que
# más se nota en equipos de gama baja (instalación, arranque y memoria).
android.enableR8.fullMode=true
kotlin.code.style=official
# Compilación incremental de Kotlin y de recursos: en un portátil modesto la
# recompilación tras un cambio pequeño pasa de minutos a segundos.
kotlin.incremental=true
android.nonFinalResIds=true
